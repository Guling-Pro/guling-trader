name: Build Windows executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # required for softprops/action-gh-release to create release + upload assets

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Download Tesseract for bundling
        shell: pwsh
        run: |
          $TessVersion = "5.4.0.20240606"
          $TessUrl = "https://digi.bib.uni-mannheim.de/tesseract/tesseract-ocr-w64-setup-v$TessVersion.exe"
          $TessExe = "tess-setup.exe"
          $TessBundle = "tess-bundle"

          Write-Host "下载 Tesseract $TessVersion..."
          $headers = @{"User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
          Invoke-WebRequest -Uri $TessUrl -OutFile $TessExe -Headers $headers

          Write-Host "Silent install 到临时目录..."
          Start-Process -Wait -FilePath $TessExe -ArgumentList "/S", "/D=$pwd\$TessBundle"

          Write-Host "验证 Tesseract 文件..."
          if (!(Test-Path "$TessBundle\tesseract.exe")) {
            throw "tesseract.exe 不存在于 $TessBundle"
          }
          if (!(Test-Path "$TessBundle\tessdata\chi_sim.traineddata")) {
            throw "chi_sim.traineddata 不存在"
          }
          if (!(Test-Path "$TessBundle\tessdata\eng.traineddata")) {
            throw "eng.traineddata 不存在"
          }

          Write-Host "✓ Tesseract bundle 准备完成"

      - name: Build single-file executable
        run: |
          pyinstaller --onefile --windowed `
                      --name guling-trader `
                      --paths src `
                      --collect-submodules trader `
                      --add-binary "tess-bundle\tesseract.exe;tesseract" `
                      --add-data "tess-bundle\tessdata\chi_sim.traineddata;tesseract/tessdata" `
                      --add-data "tess-bundle\tessdata\eng.traineddata;tesseract/tessdata" `
                      run_trader.py
        shell: pwsh

      - name: Verify executable size
        shell: pwsh
        run: |
          $exePath = "dist\guling-trader.exe"
          $sizeBytes = (Get-Item $exePath).Length
          $sizeMB = [math]::Round($sizeBytes / 1MB, 2)
          Write-Host "✓ 构建完成：$sizeMB MB"

          if ($sizeMB -gt 100) {
            Write-Host "⚠ 警告：executable 大小超过 100MB ($sizeMB MB)"
          }

      - name: Compute SHA-256 checksum
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist\guling-trader.exe).Hash
          "$hash  guling-trader.exe" | Out-File -Encoding ASCII dist\guling-trader.exe.sha256
        shell: pwsh

      - name: Upload artifacts (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: guling-trader-win
          path: |
            dist/guling-trader.exe
            dist/guling-trader.exe.sha256

      - name: Publish GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/guling-trader.exe
            dist/guling-trader.exe.sha256
          generate_release_notes: true
